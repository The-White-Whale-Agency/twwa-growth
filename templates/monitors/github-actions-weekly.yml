# twwa-growth weekly monitors for one client repo. Never deploys, never merges, never writes to GBP.
# Secrets (optional; missing ones make that monitor "nicht geprüft"): GOOGLE_APPLICATION_CREDENTIALS_JSON,
# BING_WEBMASTER_API_KEY, DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD, OPENAI_API_KEY, PERPLEXITY_API_KEY, GEMINI_API_KEY.
name: twwa-weekly
on:
  schedule: [{cron: "0 5 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: read, issues: write}
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: The-White-Whale-Agency/twwa-growth, path: .twwa-plugin}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: credentials
        run: |
          if [ -n "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > "$RUNNER_TEMP/gcp.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
          fi
      - name: monitors
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          P=.twwa-plugin/scripts
          python3 $P/gsc.py snapshot || true
          python3 $P/bing_wmt.py snapshot || true
          python3 $P/monitor.py all || echo "P1=1" >> "$GITHUB_ENV"
          python3 $P/measure.py alerts --json > alerts.json || true
          python3 $P/opportunities.py detect || true
      - uses: actions/upload-artifact@v4
        with: {name: twwa-snapshots, path: ".twwa-growth/snapshots/"}
      - name: issue on P1
        if: env.P1 == '1'
        run: gh issue create --title "twwa-growth: P1 alert" --body-file alerts.json
        env: {GH_TOKEN: "${{ github.token }}"}
